<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Disease Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .result-card {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient text-gray-800 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-2xl mx-auto">
        <div class="bg-white/80 rounded-2xl shadow-2xl result-card p-8 md:p-12">
            
            <header class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Chicken Disease Classifier</h1>
                <p class="text-gray-600 mt-2">Upload an image of a chicken dropping to get a diagnosis.</p>
            </header>

            <form id="upload-form" class="space-y-6">
                <div class="flex items-center justify-center w-full">
                    <label for="image-upload" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                        <div id="upload-prompt" class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-500">PNG, JPG, or JPEG</p>
                        </div>
                        <img id="image-preview" src="#" alt="Image Preview" class="hidden w-full h-full object-cover rounded-lg"/>
                        <input id="image-upload" type="file" class="hidden" accept="image/png, image/jpeg, image/jpg" />
                    </label>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    Diagnose Chicken
                </button>
            </form>
            
            <div id="result-section" class="text-center mt-8 hidden">
                <div id="spinner" class="mx-auto"></div>
                <div id="result-text">
                    <h2 class="text-2xl font-semibold mb-2">Diagnosis Result:</h2>
                    <p id="prediction" class="text-3xl font-bold text-indigo-600 bg-indigo-100 rounded-lg py-3 px-4 inline-block"></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- ELEMENT REFERENCES ---
        const uploadForm = document.getElementById('upload-form');
        const imageUpload = document.getElementById('image-upload');
        const imagePreview = document.getElementById('image-preview');
        const uploadPrompt = document.getElementById('upload-prompt');
        const resultSection = document.getElementById('result-section');
        const spinner = document.getElementById('spinner');
        const resultText = document.getElementById('result-text');
        const predictionEl = document.getElementById('prediction');
        const dropZone = document.querySelector('label[for="image-upload"]');

        // --- FILE HANDLING LOGIC ---
        function handleFile(file) {
            // Ensure a file is selected and it's an image
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadPrompt.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please select an image file (PNG, JPG, or JPEG).");
                imageUpload.value = ""; // Clear the file input
            }
        }

        // --- EVENT LISTENERS ---

        // Handle file selection from the "Browse" button
        imageUpload.addEventListener('change', () => {
            if (imageUpload.files.length > 0) {
                handleFile(imageUpload.files[0]);
            }
        });

        // Prevent default browser behavior for drag-and-drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Add visual indicator when dragging over the drop zone
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.add('bg-blue-50', 'border-blue-400');
            }, false);
        });

        // Remove visual indicator
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.remove('bg-blue-50', 'border-blue-400');
            }, false);
        });

        // Handle the actual file drop
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            // Assign the dropped files to our hidden file input
            imageUpload.files = files;
            
            // Handle the file for preview
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }, false);

        // Handle the form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = imageUpload.files[0];
            if (!file) {
                alert("Please select an image file first.");
                return;
            }

            // Show spinner and hide previous result
            resultSection.classList.remove('hidden');
            spinner.style.display = 'block';
            resultText.classList.add('hidden');

            const formData = new FormData();
            formData.append('image', file);

            try {
                // Send image to the Flask backend
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Display the prediction
                predictionEl.textContent = data.prediction;
                // Reset colors in case of previous error
                predictionEl.classList.add('text-indigo-600', 'bg-indigo-100');
                predictionEl.classList.remove('text-red-600', 'bg-red-100');
                
            } catch (error) {
                console.error("Error:", error);
                predictionEl.textContent = "Error during diagnosis.";
                predictionEl.classList.remove('text-indigo-600', 'bg-indigo-100');
                predictionEl.classList.add('text-red-600', 'bg-red-100');
            } finally {
                // Hide spinner and show result
                spinner.style.display = 'none';
                resultText.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
